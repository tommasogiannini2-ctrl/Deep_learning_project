# =============================================================================
# File di configurazione unico del progetto.
# Tutto il codice legge gli iperparametri da qui (tramite src/config.py):
# per un esperimento basta modificare questo file.
# I percorsi sono relativi alla cartella principale del progetto.
# =============================================================================

# Riproducibilità
seed: 42

# -----------------------------------------------------------------------------
# Dati
# -----------------------------------------------------------------------------
data:
  root: DATA
  splits:
    train: train_multi_output_clear_sky
    id: val_chopped_multi_output_clear_sky
    ood_s: ood-s_chopped_multi_output_clear_sky
    ood_t: ood-t_chopped_multi_output_clear_sky
  # Lo scaler va preso SEMPRE dallo split di train
  scaler_file: train_multi_output_clear_sky/scaler.json
  # Frazione del train usata come validazione per scegliere gli iperparametri
  val_fraction: 0.15
  # Come dividere train/validazione: "random" oppure "area" (per area geografica)
  val_split_by: area
  # Bilancia lo split train/val per area su numero di campioni e classi climatiche di Köppen
  val_balance_climate: true
  num_workers: 0

# -----------------------------------------------------------------------------
# Preprocessing e pipeline dataset (Persona 1)
# -----------------------------------------------------------------------------
preprocessing:
  normalize_features: true      # applica standardization_arcsinh con lo scaler del train
  normalize_targets: true       # applica standardization_arcsinh ai target (inversa in valutazione)
  nan_fill_value: 0.0           # riempimento post-scaling dopo masking (MAI interpolazione)
  mask_true_is_missing: true    # convenzione fissa: True = NaN/padding, False = valido
  max_seq_len: 150              # supporta sequenze fino ad almeno 150 giorni (ood_s arriva a 126)
  dynamic_padding: true         # padding alla lunghezza massima del batch
  use_climate: false            # fisso a false: 100% "unknown" su ood_s
  use_future_meteo: true        # false solo per ablation senza meteo futuro
  drop_features: []             # es. ["wind"] per ablation
  add_delta_t: true             # feature temporali Δt rispetto a t0 e ai future_target_positions

# -----------------------------------------------------------------------------
# Vincoli fissati dalla traccia (non modificare)
# -----------------------------------------------------------------------------
task:
  targets: [NDVI, GNDVI, EVI]
  n_past: 3
  n_future: 3
  quantiles: [0.1, 0.5, 0.9]

# -----------------------------------------------------------------------------
# Modello (da completare quando scegliamo l'architettura)
# -----------------------------------------------------------------------------
model:
  name: residual_mlp          # modello da usare: persistence | residual_mlp
  # Parametri di ciascun modello: viene letto solo il blocco del modello scelto in `name`.
  params:
    persistence: {}           # nessun parametro (ripete l'ultima osservazione)
    residual_mlp:
      hidden_dim: 128         # neuroni per strato nascosto
      num_layers: 2           # strati nascosti (Linear -> LayerNorm -> GELU -> Dropout)
      dropout: 0.1
      time_dim: 16            # dimensione della codifica sinusoidale dell'orizzonte (pari)
      residual: true          # true: prevede la variazione rispetto a last_obs

# -----------------------------------------------------------------------------
# Addestramento
# -----------------------------------------------------------------------------
training:
  epochs: 50
  batch_size: 256
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: adamw            # adam | adamw | sgd
  scheduler: cosine           # none | cosine | plateau
  plateau_factor: 0.5         # solo con scheduler: plateau (moltiplica il learning rate)
  plateau_patience: 3         # solo con scheduler: plateau (epoche senza miglioramento prima di ridurlo)
  gradient_clip: 1.0          # norma massima del gradiente; null per disattivare
  early_stopping_patience: 10 # epoche senza miglioramento in validazione; null per disattivare
  loss: pinball               # pinball (Pinball Loss sui quantili di task.quantiles)
  device: auto                # auto | cpu | cuda

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  dir: runs
  experiment_name: default

